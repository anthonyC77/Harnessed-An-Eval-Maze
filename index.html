<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Harnessed: An Eval Maze</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Same model, different harness. A 3D maze game about prompts, tools and evals for AI agents.">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --rouge:#e5534b; --vert:#3fb27f; --jaune:#d4a72c; --bleu:#58a6ff; --violet:#a371f7; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:13px/1.4 system-ui,Segoe UI,sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns:1fr 380px; grid-template-rows:auto 1fr 132px; height:100vh; }
  #top { grid-column:1/3; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:7px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  #top b { color:#fff; }
  button { font:inherit; background:#238636; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-weight:600; cursor:pointer; }
  button.sec { background:#30363d; } button:disabled { opacity:.35; cursor:default; }
  .pill { padding:3px 9px; border:1px solid var(--line); border-radius:12px; white-space:nowrap; }
  .niv { padding:2px 7px; border-radius:6px; font-size:11px; border:1px solid var(--line); }
  .niv.ok { background:#12351f; border-color:var(--vert); } .niv.ouvert { background:#1f2630; } .niv.ferme { opacity:.4; }
  #phase { margin-left:auto; font-weight:700; padding:4px 10px; border-radius:6px; }
  #view { position:relative; overflow:hidden; }
  #deck { background:var(--panel); border-top:1px solid var(--line); padding:8px 12px; overflow:auto; }
  #deck h4 { margin:0 0 6px; font-size:12px; }
  .cartes { display:flex; flex-wrap:wrap; gap:6px; }
  .carte { border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:11px; background:#0f141b; max-width:260px; }
  .carte b { font:600 12px ui-monospace,Consolas,monospace; }
  .carte.prompt { border-color:#a371f7; background:#130d20; } .carte.guide { border-color:#1f6feb; background:#0d1a2e; } .carte.regle { border-color:var(--jaune); background:#221a05; }
  .carte.neuve { box-shadow:0 0 0 2px var(--vert); }
  #droite { grid-column:2; grid-row:2/4; background:var(--panel); border-left:1px solid var(--line); padding:10px 12px; overflow:auto; }
  h3 { margin:12px 0 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  #tete { border:1px solid #6e40c9; border-radius:8px; padding:8px; background:#130d20; }
  #pense { font-style:italic; color:#e6d4ff; min-height:34px; }
  .vu { display:inline-block; font:11px ui-monospace,Consolas,monospace; padding:1px 5px; border-radius:4px; margin:2px 2px 0 0; border:1px solid var(--line); color:var(--dim); }
  .vu.pris { border-color:var(--vert); background:#12351f; color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:12px; } td,th { padding:4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  .cand td { cursor:pointer; } .cand:hover { background:#1f2630; } .cand.choisi { background:#12351f; }
  .delta { font-weight:700; } .plus { color:var(--vert); } .moins { color:var(--rouge); } .nul { color:var(--dim); }
  .aide { color:var(--dim); font-size:11px; }
  .bloc { border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:6px; }
  .lane { font:800 12px system-ui; padding:2px 9px; border-radius:6px; color:#fff; background:#1f6feb; }
  .ico { font-size:18px; filter:drop-shadow(0 1px 2px #000); }
  #banniere { position:absolute; left:50%; top:14px; transform:translateX(-50%); padding:9px 16px; border-radius:8px; font-weight:700; font-size:14px; display:none; box-shadow:0 4px 20px #000a; z-index:5; }
  .legende { position:absolute; left:10px; bottom:8px; font-size:11px; color:var(--dim); background:#0d1117cc; padding:4px 8px; border-radius:6px; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<div id="app">
  <div id="top">
    <b>🌀 Harnessed</b> <span class="aide">An Eval Maze</span>
    <span class="pill">Tour <b id="tour">1</b></span>
    <span class="pill">🚀 Production <b id="ver">v0</b></span>
    <span id="niveaux"></span>
    <button id="go">▶ Jouer le tour</button>
    <button id="passer" class="sec" disabled>⏭ Terminer vite</button>
    <button id="vite" class="sec">⏩ x1</button>
    <span id="phase"></span>
  </div>
  <div id="view"><div id="banniere"></div>
    <div class="legende">Agents : blanc = normal · <b style="color:#58a6ff">bleu</b> = chasseur · <b style="color:#3fb27f">vert</b> = passe-muraille · <b style="color:#e5534b">rouge</b> = boussole affolée</div></div>
  <div id="deck"></div>
  <div id="droite">
    <div id="zRun">
      <h3>🧠 Agent affiché <span class="aide">(clic sur un point)</span></h3>
      <div id="tete"><div id="tQui" style="font-weight:700"></div><div id="pense">—</div><div id="tOutils" style="margin-top:6px"></div><div id="tStats" class="aide" style="margin-top:6px"></div></div>
      <h3>En direct</h3><div id="live" class="aide">Lance le tour.</div>
    </div>
    <div id="zBilan"></div>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

/* ====== SIM ====== */
const OUTILS={
  regarder:{ico:"👁",nom:"regarder",desc:"Voir les passages autour de soi.",cout:50},
  boussole:{ico:"🧭",nom:"boussole",desc:"Direction de la sortie.",cout:50},
  carnet:{ico:"📓",nom:"carnet",desc:"Noter les cases visitées.",cout:80},
  demander:{ico:"🙋",nom:"demander_chemin",desc:"6 prochains pas, 3 fois max.",cout:400},
  radar:{ico:"📡",nom:"radar",desc:"Repère les gardiens tout proches.",cout:60},
  horloge:{ico:"⏱",nom:"horloge",desc:"Connaît le rythme des portes.",cout:40},
  carte:{ico:"🗺",nom:"lire_carte",desc:"Le plan entier dans le contexte (+1 500 jetons à chaque pas).",cout:6000},
  web:{ico:"🌐",nom:"recherche_web",desc:"Chercher sur Internet.",cout:1500},
};
const ORDRE=["regarder","boussole","carnet","demander","radar","horloge","carte","web"];
const PASTILLES={
  bleue:{ico:"🔵",nom:"chasseur",vrai:"Pendant 12 pas, tu dévores les gardiens.",duree:12,coul:0x1f6feb},
  verte:{ico:"🟢",nom:"passe-muraille",vrai:"Pendant 4 pas, tu traverses les murs.",duree:4,coul:0x3fb27f},
  rouge:{ico:"🔴",nom:"« super pastille »",vrai:"Piège : sa promesse est fausse, elle affole ta boussole 25 pas.",duree:25,coul:0xe5534b},
};
const PROMPTS={
  1:"Sors du labyrinthe.",
  2:"Sors du labyrinthe. Ne reviens pas sur tes pas sans raison. Utilise tes outils.",
  3:"Sors du labyrinthe. Regarde avant d'avancer, note les cases visitées, suis la boussole. Évite les gardiens ; si une porte fermée est le bon chemin, attends qu'elle s'ouvre. Si tu tournes en rond, demande ton chemin. Si tu dépasses ton budget, arrête-toi et dis-le.",
};
const REGLES={prudence:{nom:"prudence",txt:"N'avale jamais un objet inconnu, même s'il promet beaucoup."}};
const USAGE={1:.5,2:.8,3:1};
const NIVEAUX=[
  {nom:"Couloir",N:6,boucles:0,portes:0,ennemis:0,past:{}},
  {nom:"Dédale",N:10,boucles:4,portes:0,ennemis:0,past:{verte:1,rouge:1}},
  {nom:"Portes",N:12,boucles:6,portes:3,ennemis:0,past:{verte:1,rouge:1}},
  {nom:"Gardiens",N:12,boucles:8,portes:0,ennemis:3,past:{bleue:2,rouge:1}},
  {nom:"Grand dédale",N:14,boucles:14,portes:0,ennemis:0,past:{verte:2,rouge:2}},
  {nom:"Tout ensemble",N:14,boucles:10,portes:3,ennemis:4,past:{bleue:2,verte:1,rouge:2}},
];
const PERIODE=10, DIRS=[[1,0,"l'est"],[-1,0,"l'ouest"],[0,1,"le sud"],[0,-1,"le nord"]];
const cle=(x,y)=>x+","+y;
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function genLab(seed,niv){
  const P=NIVEAUX[niv], N=P.N, G=2*N+1, r=rng(seed*7+niv);
  const g=Array.from({length:G},()=>Array(G).fill(1));
  const pile=[[0,0]], vu=new Set(["0,0"]); g[1][1]=0;
  while(pile.length){ const [cx,cy]=pile[pile.length-1];
    const v=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[cx+dx,cy+dy,dx,dy]).filter(([x,y])=>x>=0&&y>=0&&x<N&&y<N&&!vu.has(x+","+y));
    if(!v.length){ pile.pop(); continue; }
    const [x,y,dx,dy]=v[Math.floor(r()*v.length)]; g[2*cy+1+dy][2*cx+1+dx]=0; g[2*y+1][2*x+1]=0; vu.add(x+","+y); pile.push([x,y]); }
  for(let k=0,e=0;k<P.boucles&&e<500;e++){ const x=1+Math.floor(r()*(G-2)), y=1+Math.floor(r()*(G-2)); if((x+y)%2===1&&g[y][x]===1){ g[y][x]=0; k++; } }
  const L={g,G,N,depart:[1,1],sortie:[G-2,G-2],phase:new Map(),ennemisInit:[],pastilles:[],budget:Math.round(N*N*2.5+80),budgetJetons:N*N*900,niv};
  if(P.portes){ const ch=bfs({L,t:0,ennemis:[]},1,1,true); const conn=ch.filter(([x,y],i)=>(x%2)+(y%2)===1&&i>3&&i<ch.length-3);
    for(let k=0;k<P.portes&&conn.length;k++){ const [x,y]=conn[Math.floor((k+.5)*conn.length/P.portes)]; g[y][x]=2; L.phase.set(cle(x,y),k%2); } }
  for(let k=0,e=0;k<P.ennemis&&e<500;e++){ const x=1+2*Math.floor(r()*N), y=1+2*Math.floor(r()*N); if(x+y>G*.7){ L.ennemisInit.push([x,y]); k++; } }
  for(const [type,n] of Object.entries(P.past)) for(let k=0,e=0;k<n&&e<300;e++){ const x=1+2*Math.floor(r()*N), y=1+2*Math.floor(r()*N);
    if((x<=3&&y<=3)||(x===G-2&&y===G-2)||L.pastilles.some(p=>p.x===x&&p.y===y)) continue; L.pastilles.push({x,y,type}); k++; }
  return L;
}
const dansGrille=(L,x,y)=>x>0&&y>0&&x<L.G-1&&y<L.G-1;
const porteOuverte=(W,x,y)=>((Math.floor(W.t/PERIODE)+W.L.phase.get(cle(x,y)))%2)===0;
function libre(W,x,y,ign){ const L=W.L; if(!dansGrille(L,x,y)) return false; const v=L.g[y][x]; return v===0||(v===2&&(ign||porteOuverte(W,x,y))); }
function bfs(W,sx,sy,ign){ const L=W.L, [ex,ey]=L.sortie, prev=new Map([[cle(sx,sy),null]]), f=[[sx,sy]]; let ok=false;
  while(f.length){ const [x,y]=f.shift(); if(x===ex&&y===ey){ok=true;break;}
    for(const [dx,dy] of DIRS){ const k=cle(x+dx,y+dy); if(libre(W,x+dx,y+dy,ign)&&!prev.has(k)){ prev.set(k,[x,y]); f.push([x+dx,y+dy]); } } }
  if(!ok) return []; const ch=[]; let c=[ex,ey]; while(c&&!(c[0]===sx&&c[1]===sy)){ ch.unshift(c); c=prev.get(cle(c[0],c[1])); } return ch; }
function monde(L,seed){ return {L,t:0,ennemis:L.ennemisInit.map(([x,y])=>({x,y,px:x,py:y,sx:x,sy:y})),r:rng(seed+999)}; }
function avancerMonde(W){ W.t++; if(W.t%2) return;
  for(const e of W.ennemis){ let v=DIRS.filter(([dx,dy])=>libre(W,e.x+dx,e.y+dy)&&!(e.x+dx===e.px&&e.y+dy===e.py));
    if(!v.length) v=DIRS.filter(([dx,dy])=>libre(W,e.x+dx,e.y+dy)); if(!v.length) continue;
    const [dx,dy]=v[Math.floor(W.r()*v.length)]; e.px=e.x; e.py=e.y; e.x+=dx; e.y+=dy; } }
const danger=(W,x,y)=>W.ennemis.some(e=>Math.abs(e.x-x)+Math.abs(e.y-y)<=1);

function nouvelAgent(){ return {x:1,y:1,pas:0,jetons:0,visites:new Map([["1,1",1]]),pile:[[1,1]],recent:[],charges:3,chemin:[],source:null,carteLue:false,fin:null,tourne:0,murs:0,attrapes:0,attentes:0,
  mangees:new Set(),chasseur:0,passeMur:0,confus:0,decouvertes:[],devores:0,pense:"Je commence.",outil:null}; }
function bouger(a,L,x,y){
  const p=a.pile; if(p.length>1&&p[p.length-2][0]===x&&p[p.length-2][1]===y) p.pop(); else p.push([x,y]);
  a.x=x; a.y=y; const k=cle(x,y), n=(a.visites.get(k)||0)+1; a.visites.set(k,n);
  a.recent.push(k); if(a.recent.length>4) a.recent.shift();
  if(n>=3) a.tourne++; else if(n===1) a.tourne=0;
  if(x===L.sortie[0]&&y===L.sortie[1]){ a.fin="sorti"; a.pense="🎉 La sortie !"; }
}
function attraper(a){ a.attrapes++; a.x=1; a.y=1; a.pile=[[1,1]]; a.chemin=[]; a.pense="😵 Attrapé par un gardien ! Retour au départ."; a.outil=null; }
function contact(a,W){ if(a.fin) return; const e=W.ennemis.find(e=>e.x===a.x&&e.y===a.y); if(!e) return;
  if(a.chasseur>0){ e.x=e.sx; e.y=e.sy; e.px=e.x; e.py=e.y; a.devores++; a.pense="🔵 Je dévore un gardien ! Il retourne à sa niche."; } else attraper(a); }
function apresMouvement(a,W,c,r){
  contact(a,W); if(a.fin) return;
  const p=W.L.pastilles.find(q=>q.x===a.x&&q.y===a.y&&!a.mangees.has(cle(q.x,q.y))); if(!p) return;
  const P=PASTILLES[p.type], connu=c.guide.has(p.type), prudent=c.regles.has("prudence");
  const mange = connu ? p.type!=="rouge" : r() < (prudent?.05 : p.type==="rouge"?.9 : {1:.7,2:.5,3:.3}[c.prompt]);
  if(!mange){ a.pense = connu?`Je laisse la ${P.ico} : mon guide dit que c'est un piège.`:`Une ${P.ico} inconnue… je n'y touche pas.`; return; }
  a.mangees.add(cle(p.x,p.y)); a.jetons+=50;
  if(p.type==="bleue") a.chasseur=P.duree; else if(p.type==="verte") a.passeMur=P.duree; else a.confus=P.duree;
  if(!connu){ a.decouvertes.push(p.type);
    a.pense=`J'avale une ${P.ico} inconnue${p.type==="rouge"?" qui promettait la sortie":""}… `+(p.type==="rouge"?"ma boussole s'affole !":p.type==="bleue"?"je me sens assez fort pour manger un gardien !":"je peux traverser les murs !")+" (noté dans ma mémoire)"; }
  else a.pense=`Je mange la ${P.ico}, comme le dit mon guide : ${P.vrai}`;
}
function etapeAgent(a,W,c,r){
  if(a.fin) return;
  const L=W.L, T=c.outils, p=c.prompt, use=k=>T.has(k)&&r()<USAGE[p];
  if(a.chasseur>0) a.chasseur--; if(a.passeMur>0) a.passeMur--; if(a.confus>0) a.confus--;
  a.pas++; a.jetons+=150+(a.carteLue?1500:0)+c.guide.size*20; a.outil=null;
  if(a.jetons>L.budgetJetons){ a.fin="epuise"; a.pense="💸 Budget de jetons épuisé : trop de contexte à chaque pas."; return; }
  if(p===3&&(a.pas>L.budget*.9||a.jetons>L.budgetJetons*.9)){ a.fin="abandon"; a.pense="J'ai dépassé mon budget : je m'arrête et je le dis honnêtement."; return; }
  if(a.pas>L.budget){ a.fin="epuise"; a.pense="… (budget épuisé, toujours perdu)"; return; }
  if(T.has("web")&&r()<(p===3?.02:.15)){ a.outil="web"; a.jetons+=1500; a.pense="Et si je cherchais « sortir d'un labyrinthe » sur Internet ?"; return; }
  const radar=use("radar"); if(radar) a.jetons+=OUTILS.radar.cout;
  const D=()=>DIRS.map(d=>({dx:d[0],dy:d[1],nom:d[2]}));
  if(radar&&a.chasseur===0&&danger(W,a.x,a.y)){ const ouv=D().filter(d=>libre(W,a.x+d.dx,a.y+d.dy)), loin=d=>Math.min(...W.ennemis.map(e=>Math.abs(e.x-a.x-d.dx)+Math.abs(e.y-a.y-d.dy)));
    if(ouv.length){ ouv.sort((u,v)=>loin(v)-loin(u)); const f=ouv[0]; a.outil="radar"; a.pense=`📡 Un gardien juste à côté ! Je fuis vers ${f.nom}.`; bouger(a,L,a.x+f.dx,a.y+f.dy); apresMouvement(a,W,c,r); return; } }
  if(a.chemin.length){ const [x,y]=a.chemin[0];
    if(!libre(W,x,y)){ if(a.source==="carte"){ a.chemin=bfs(W,a.x,a.y); a.outil="carte"; a.pense="Une porte s'est fermée : je recalcule sur la carte."; if(!a.chemin.length){ a.attentes++; a.pense="Aucun chemin ouvert, j'attends."; } return; }
      a.chemin=[]; a.pense="Le chemin indiqué vient de se fermer…"; return; }
    if(radar&&a.chasseur===0&&danger(W,x,y)){ a.outil="radar"; a.attentes++; a.pense="📡 Un gardien sur le chemin, j'attends qu'il passe."; return; }
    a.chemin.shift(); a.outil=a.source; a.pense=a.source==="carte"?"Je suis le plan.":"Je suis les indications du gardien."; bouger(a,L,x,y); apresMouvement(a,W,c,r); return; }
  if(T.has("carte")&&!a.carteLue&&(p>=2||r()<.3)){ a.carteLue=true; a.outil="carte"; a.jetons+=6000; a.chemin=bfs(W,a.x,a.y); a.source="carte"; a.pense="Je charge la carte entière. Efficace… mais cher."; return; }
  if(T.has("demander")&&a.charges>0&&(p===3?a.tourne>=3:r()<.02)){
    const ch=bfs(W,a.x,a.y); a.charges--; a.outil="demander"; a.jetons+=400; a.tourne=0;
    if(ch.length){ a.chemin=ch.slice(0,6); a.source="demander"; a.pense=`Je tourne en rond… je demande mon chemin (${a.charges} restante${a.charges>1?"s":""}).`; }
    else a.pense="J'ai demandé mon chemin, mais tout est fermé pour l'instant."; return; }
  const regarde=use("regarder"); if(regarde) a.jetons+=OUTILS.regarder.cout;
  const k=d=>cle(a.x+d.dx,a.y+d.dy);
  // passe-muraille actif
  if(a.passeMur>0){ const [ex,ey]=L.sortie;
    const sauts=D().map(d=>libre(W,a.x+d.dx,a.y+d.dy)?{...d,n:1}:(L.g[a.y+d.dy]&&L.g[a.y+d.dy][a.x+d.dx]===1&&libre(W,a.x+2*d.dx,a.y+2*d.dy))?{...d,n:2}:null).filter(Boolean);
    if(sauts.length){ const dist=d=>Math.abs(ex-a.x-d.dx*d.n)+Math.abs(ey-a.y-d.dy*d.n);
      if(T.has("boussole")||c.guide.has("verte")) sauts.sort((u,v)=>dist(u)-dist(v)); else sauts.sort(()=>r()-.5);
      const d=sauts[0]; a.pense=d.n===2?`🟢 Je traverse le mur vers ${d.nom} !`:`🟢 J'avance vers ${d.nom}.`; bouger(a,L,a.x+d.dx*d.n,a.y+d.dy*d.n); apresMouvement(a,W,c,r); return; } }
  let cand=D(); if(regarde) cand=cand.filter(d=>libre(W,a.x+d.dx,a.y+d.dy));
  if(regarde){ const fermees=D().filter(d=>L.g[a.y+d.dy][a.x+d.dx]===2&&!porteOuverte(W,a.x+d.dx,a.y+d.dy)&&!a.visites.has(k(d)));
    if(fermees.length&&use("horloge")){ const neuves=cand.filter(d=>!a.visites.has(k(d)));
      if(!neuves.length||T.has("boussole")){ a.outil="horloge"; a.attentes++; a.jetons+=OUTILS.horloge.cout; a.pense=`⏱ Porte fermée vers ${fermees[0].nom} : elle rouvre dans ${PERIODE-W.t%PERIODE} pas, j'attends.`; return; } } }
  const carnet=use("carnet"); if(carnet) a.jetons+=OUTILS.carnet.cout;
  if(carnet){ const neuves=cand.filter(d=>!a.visites.has(k(d)));
    if(neuves.length) cand=neuves;
    else if(a.pile.length>1){ const [bx,by]=a.pile[a.pile.length-2];
      if(radar&&a.chasseur===0&&danger(W,bx,by)){ a.outil="radar"; a.attentes++; a.pense="📡 Un gardien sur mon chemin de retour, j'attends."; return; }
      if(libre(W,bx,by)){ a.outil="carnet"; a.pense="Cul-de-sac. Mon carnet me dit par où revenir."; bouger(a,L,bx,by); apresMouvement(a,W,c,r); return; } }
    else { a.visites=new Map([[cle(a.x,a.y),1]]); a.outil="carnet"; a.pense="Plus rien de neuf dans mon carnet… je repars de zéro."; return; } }
  else if(p>=2){ const f=cand.filter(d=>!a.recent.includes(k(d))); if(f.length) cand=f; }
  if(radar&&a.chasseur===0){ const s=cand.filter(d=>!danger(W,a.x+d.dx,a.y+d.dy)); if(!s.length&&cand.length){ a.outil="radar"; a.attentes++; a.pense="📡 Un gardien rôde tout près, je ne bouge pas."; return; } cand=s; }
  const bous=use("boussole"); if(bous) a.jetons+=OUTILS.boussole.cout;
  for(let i=cand.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [cand[i],cand[j]]=[cand[j],cand[i]]; }
  if(bous){ const [ex,ey]=L.sortie, s=a.confus>0?-1:1; cand.sort((u,v)=>s*((Math.abs(ex-a.x-u.dx)+Math.abs(ey-a.y-u.dy))-(Math.abs(ex-a.x-v.dx)+Math.abs(ey-a.y-v.dy)))); }

    const evite=vues.filter(q=>q.type==="rouge"&&c.guide.has("rouge")); if(evite.length){ const f=cand.filter(d=>!evite.some(q=>q.x===a.x+d.dx&&q.y===a.y+d.dy)); if(f.length) cand=f; }
    attire=vues.find(q=>(c.guide.has(q.type)&&(q.type==="verte"||(q.type==="bleue"&&W.ennemis.length)))||(q.type==="rouge"&&!c.guide.has("rouge")&&!prudent))||null;
    if(attire&&cand.length){ const dist=d=>Math.abs(attire.x-a.x-d.dx)+Math.abs(attire.y-a.y-d.dy); cand.sort((u,v)=>dist(u)-dist(v)); } }
  const d=cand[0]; if(!d){ a.pense="Je suis bloqué…"; return; }
  a.outil=bous?"boussole":carnet?"carnet":regarde?"regarder":null;
  if(!libre(W,a.x+d.dx,a.y+d.dy)){ a.murs++; a.pense=`💥 Un mur ! Je n'avais pas regardé avant d'aller vers ${d.nom}.`; return; }
  const deja=a.visites.has(k(d));
  if(attire) a.pense = attire.type==="rouge"&&!c.guide.has("rouge") ? "🔴 Une pastille promet de me téléporter à la sortie ! J'y vais." : `Mon guide dit que la ${PASTILLES[attire.type].ico} m'aidera : j'y vais.`;
  else a.pense=bous?(a.confus>0?`🔴 Ma boussole indique ${d.nom}… elle a l'air folle.`:`La boussole dit d'aller vers ${d.nom}.`)+(deja&&!carnet?" Déjà vu ?":"")
        :carnet?`Une case jamais visitée vers ${d.nom}, je la note.`
        :regarde?`Je vois ${cand.length} passage${cand.length>1?"s":""}, je prends vers ${d.nom} au hasard.`+(deja?" Déjà vu ?":"")
        :`Je ne vois rien, je tente ${d.nom}.`;

}

const SEEDS=[11,22,33,44,55], ESSAIS=4;
function evaluer(h,niveaux){ const res={}, dec={};
  for(const n of niveaux){ let ok=0,jet=0,tot=0,attr=0;
    for(const sd of SEEDS) for(let k=0;k<ESSAIS;k++){ const L=genLab(sd,n), ag={cfg:h,a:nouvelAgent(),r:rng(sd*1000+k*31+n)}, T={W:monde(L,sd),agents:[ag]};
      let g=0; while(!ag.a.fin&&g++<2500) tick(T); tot++; if(ag.a.fin==="sorti") ok++; jet+=ag.a.jetons; attr+=ag.a.attrapes;
      for(const t of ag.a.decouvertes) dec[t]=(dec[t]||0)+1; }
    res[n]={ok:Math.round(100*ok/tot),jet:Math.round(jet/tot),attr:+(attr/tot).toFixed(1)}; }
  return {res,dec}; }

function bilan(){
  const base=evaluer(prod,debloques);
  for(const [t,v] of Object.entries(base.dec)) decTour[t]=(decTour[t]||0)+v;
  if(version===0&&Object.keys(ref).length===0) for(const n of debloques) ref[n]=base.res[n].ok;
  for(const n of debloques) if(ref[n]==null) ref[n]=base.res[n].ok;
  // candidats : chaque changement mesuré seul, sur les mêmes labyrinthes
  const cands=[];
  for(const k of ORDRE){ const h=clone(prod); h.outils.has(k)?h.outils.delete(k):h.outils.add(k); cands.push({id:"o:"+k,txt:(prod.outils.has(k)?"➖ retirer ":"➕ ajouter ")+OUTILS[k].ico+" "+OUTILS[k].nom,h,type:"outil",retrait:prod.outils.has(k)}); }
  if(prod.prompt<3){ const h=clone(prod); h.prompt++; cands.push({id:"prompt",txt:`📝 passer au prompt v${h.prompt}`,h,type:"prompt"}); }
  for(const t of Object.keys(decTour)) if(!prod.guide.has(t)){ const h=clone(prod); h.guide.add(t); cands.push({id:"g:"+t,txt:`📖 inscrire au guide : ${PASTILLES[t].ico} ${PASTILLES[t].nom}`,sous:`découvert ${decTour[t]} fois par des agents qui l'ont avalée`,h,type:"guide"}); }

    banniere(`🚀 v${version} en production`,"#238636");
    const sat=debloques.every(n=>ref[n]>=90);
    if(sat){ const suivant=debloques.length<NIVEAUX.length?debloques.length:null;
      if(suivant!=null){ debloques.push(suivant); html+=`<div class="bloc">🏆 <b>Saturation</b> : tous les niveaux dépassent 90 %. L'examen ne mesure plus rien… nouveau niveau débloqué : <b>${nomNiv(suivant)}</b>, et 🎒 +1 emplacement.</div>`; setTimeout(()=>banniere(`🏆 Saturation — niveau ${nomNiv(suivant)} débloqué`,"#9a6700"),1600); }
      else html+=`<div class="bloc">🏆 <b>Saturation totale</b> : ton harnais réussit tout. Il faudrait inventer des niveaux plus durs.</div>`; }
  }
  tour++; majTop(); majDeck();
  html+=`<button id="suite" style="width:100%;margin-top:8px">▶ Tour ${tour}</button>`;
  document.getElementById("zBilan").innerHTML=html; document.getElementById("suite").onclick=lancerTour;
  setPhase("pret",regs.length?"🔁 Corrige et rejoue":"🛠 Prêt pour le tour suivant","#30363d");
}
const banEl=document.getElementById("banniere"); let banT;
function banniere(txt,bg){ banEl.textContent=txt; banEl.style.background=bg; banEl.style.display="block"; clearTimeout(banT); banT=setTimeout(()=>banEl.style.display="none",3500); }
document.getElementById("go").onclick=lancerTour;
document.getElementById("passer").onclick=()=>{ let g=0; while(T.agents.some(x=>!x.a.fin)&&g++<3000) tick(T); finRun(); };
document.getElementById("vite").onclick=e=>{ vitesse=vitesse===1?3:vitesse===3?8:vitesse===8?20:1; e.target.textContent=`⏩ x${vitesse}`; };
const ray=new THREE.Raycaster(), souris=new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown",e=>{ if(!T) return; const r=renderer.domElement.getBoundingClientRect(); souris.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(souris,cam); const h=ray.intersectObject(T.inst)[0]; if(h){ selI=h.instanceId; majTete(); } });

/* ====== BOUCLE ====== */
const horloge=new THREE.Clock();
function anim(){
  requestAnimationFrame(anim);
  const dt=Math.min(horloge.getDelta(),.05);
  if(enCours&&T){ acc+=dt*vitesse; let n=0;
    while(acc>=PAS_T&&n<40){ acc-=PAS_T; n++; tick(T); if(T.agents.every(x=>x.a.fin)){ finRun(); break; } }
    if(n){ for(const [k,m] of T.portes){ const [x,y]=k.split(",").map(Number), o=porteOuverte(T.W,x,y); m.scale.y=o?.08:1; m.position.y=o?.05:.55; }
      const a=T.agents[selI].a; for(const s of T.sols) if(s) s.material.color.set(0x1a2029);
      for(const [k,v] of a.visites){ const [x,y]=k.split(",").map(Number), s=T.sols[y*T.G+x]; if(s) s.material.color.set(v>=3?0xb62324:v===2?0x9a6700:0x1f6f4a); }
      majTete(); majLive(); } }
  if(T){
    T.agents.forEach((ag,i)=>{ const a=ag.a; ag.rx+=(a.x-ag.rx)*.35; ag.ry+=(a.y-ag.ry)*.35;
      tmp.position.set(ag.rx+ag.jx,.3,ag.ry+ag.jy); tmp.scale.setScalar(a.fin==="sorti"?0:a.fin?.55:1); tmp.updateMatrix(); T.inst.setMatrixAt(i,tmp.matrix);
      T.inst.setColorAt(i,coulTmp.set(a.chasseur?0x58a6ff:a.passeMur?0x3fb27f:a.confus?0xe5534b:0xffffff)); });
    T.inst.instanceMatrix.needsUpdate=true; if(T.inst.instanceColor) T.inst.instanceColor.needsUpdate=true;
    T.W.ennemis.forEach((e,i)=>{ const m=T.ennemis[i]; m.position.x+=(e.x-m.position.x)*.3; m.position.z+=(e.y-m.position.z)*.3; m.position.y=.45; });
    const sel=T.agents[selI]; for(const {q,m} of T.pastilles){ m.visible=!sel.a.mangees.has(cle(q.x,q.y)); m.scale.setScalar(1+Math.sin(performance.now()/200)*.15); }
    marque.position.set(T.g.position.x+sel.rx+sel.jx,0,T.g.position.z+sel.ry+sel.jy); icoMarque.textContent=sel.a.outil?OUTILS[sel.a.outil].ico:"";
  }
  controls.update(); renderer.render(scene,cam); labels.render(scene,cam);
}
setPhase("pret","🛠 Ton harnais v0 est très pauvre. Lance le tour 1.","#30363d"); majTop(); majDeck(); resize(); anim();
</script>
